<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store - Everyday Essentials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" type="image/svg+xml" href="gemini-svg (3).svg">



  
</head>

<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Fixed Header with Proper Spacing -->
  <header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-50">
    <div class="container mx-auto px-4 max-w-7xl h-16 flex items-center justify-between gap-3 sm:gap-6">

      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 text-lg sm:text-xl font-bold tracking-tight text-slate-900 shrink-0">
        <div class="p-1.5 bg-teal-50 text-teal-700 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </div>
        <span>Store</span>
      </a>

      <!-- Search Input -->
      <div class="flex-1 max-w-xs sm:max-w-md">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="Search products..."
            class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 transition">
        </div>
      </div>

      <!-- Navigation Bar Links -->
      <nav class="flex items-center gap-3 sm:gap-5 text-xs sm:text-sm font-semibold shrink-0">
        <a href="index.html" class="text-teal-700 hover:text-teal-800">Home</a>
        <a href="wishlist.html" class="text-slate-600 hover:text-teal-700 flex items-center gap-1">
          <span>Wishlist</span>
          <span id="wishlist-count" class="px-1.5 py-0.5 text-[10px] sm:text-xs font-bold text-white bg-teal-700 rounded-full">2</span>
        </a>
        <a href="cart.html" class="text-slate-600 hover:text-teal-700 flex items-center gap-1">
          <span>Cart</span>
          <span id="cart-count" class="px-1.5 py-0.5 text-[10px] sm:text-xs font-bold text-white bg-teal-700 rounded-full">3</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-white border-b border-slate-200 py-8 sm:py-10 px-4">
    <div class="container mx-auto text-center max-w-xl">
      <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Everyday Essentials</h1>
      <p class="mt-2 text-slate-500 text-sm sm:text-base">Discover our curated collection of quality products at honest prices.</p>
    </div>
  </section>

  <!-- Main Content Wrapper -->
  <main id="shop" class="flex-grow container mx-auto px-4 max-w-7xl py-6">
    
    <!-- Single-Line Horizontal Category Filter Bar -->
    <section class="mb-6 relative" aria-label="Category Filters">
      <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
        <!-- JS dynamic pill buttons render in a single scrollable row -->
      </div>
    </section>

    <!-- Product Grid Catalog -->
    <section aria-label="Product Catalog">
      <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <!-- Products populated via JavaScript -->
      </div>
    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="container mx-auto px-4 text-center text-xs sm:text-sm text-slate-500">
      <p>© 2026 Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>

</html>
